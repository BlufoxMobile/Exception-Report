<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exceptions Report — Jeffrey Bilbrey Region</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<!-- Perf (2026-09-02): non-render-blocking font load (media="print" + onload
     swap) so a slow/hung fonts.googleapis.com can never hold up first paint. -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,wght@0,700;1,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
/* ===== Blufox "CSG How To" design system — tokens lifted from csg-how-to.css ===== */
:root{
  --ink:#000;--ink-1:#07090c;--ink-2:#0d1116;--ink-3:#151b22;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --text:#f2efe8;--text-2:#b9b4aa;--text-3:#7d7a74;
  --brass:#d4a94f;--brass-2:#f0cf86;--brass-dim:rgba(212,169,79,.16);
  --internet:#5cc8ff;--tv:#b48cff;--voice:#5be3a0;--xh:#ffb05c;--orders:#ff7eb6;--equipment:#6fe3d6;--basics:#c9c3ff;
  --warn:#ff8a65;--ok:#5be3a0;
  --display:'Bodoni Moda',Didot,'Times New Roman',serif;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:4px;--gut:16px;--max:1320px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--text);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(212,169,79,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(92,200,255,.06),transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass-2);outline-offset:2px;border-radius:2px}
.wrap{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink-3);border-radius:99px;box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap;min-width:0}
.brand b{font:700 24px/1 var(--display)}
.brand b em{color:var(--brass-2)}
.brand span{font:600 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--text-3)}
.bar .region{margin-left:auto;font:600 12px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--text-2);white-space:nowrap}

/* ---------- hero ---------- */
.hero{padding:44px 0 26px}
.eyebrow{font:600 12px/1.4 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--brass)}
.hero h1{font:700 clamp(42px,8vw,92px)/.98 var(--display);letter-spacing:-.015em;margin:16px 0 14px}
.hero h1 em{background:linear-gradient(100deg,var(--brass) 0%,var(--brass-2) 40%,#fff6dc 50%,var(--brass-2) 60%,var(--brass) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s ease-in-out infinite;padding-right:.06em}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.hero p{color:var(--text-2);font-size:19px;margin:0;max-width:60ch}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--brass) 20%,var(--brass) 80%,transparent);opacity:.45}

/* ---------- view tabs ---------- */
.tabs{display:inline-flex;gap:4px;padding:4px;margin:26px 0 22px;border-radius:999px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line-2)}
.tab-btn{min-height:46px;padding:0 22px;border-radius:999px;font:600 15px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.tab-btn:hover:not(.active){color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.tab-btn.active{background:var(--brass);color:#120d03}

/* ---------- KPI cards ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,2fr);gap:14px;margin-bottom:22px}
.card{position:relative;border-radius:6px;background:linear-gradient(160deg,var(--ink-2),var(--ink-1));box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;--mx:50%;--my:50%;--c:var(--brass)}
.card::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 70%);opacity:.18;transition:opacity .3s;pointer-events:none}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(260px circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 22%,transparent),transparent 60%)}
.card:hover::before{opacity:1}
.card:hover::after{opacity:.3}
.stat-card{padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:150px}
.stat-card .top{display:flex;align-items:center;gap:12px}
.stat-card .ico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.stat-card .ico svg{width:22px;height:22px}
.stat-num{font:700 clamp(52px,7vw,92px)/.9 var(--display);color:var(--c);letter-spacing:-.01em;font-variant-numeric:lining-nums}
.stat-label{font:700 13px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.mini-chart{padding:20px 24px}
.mini-chart-title{font:700 13px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:14px}
.bar-row{margin-bottom:10px}
.bar-row:last-child{margin-bottom:0}
.bar-row-labels{display:flex;justify-content:space-between;gap:12px;font-size:15px;line-height:1.3;margin-bottom:5px}
.bar-row-labels .bl{color:var(--c);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row-labels .bn{color:var(--text-2);font-variant-numeric:tabular-nums;font-weight:600}
.bar-track{height:6px;border-radius:99px;background:var(--ink-3);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent),var(--c));box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent);transition:width .6s cubic-bezier(.16,1,.3,1)}

/* ---------- workspace ---------- */
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start;padding-bottom:80px}
.sidebar{position:sticky;top:80px;display:flex;flex-direction:column;max-height:calc(100vh - 96px);padding:18px 16px 12px;border-radius:6px;background:var(--ink-1);box-shadow:inset 0 0 0 1px var(--line)}
.list-label{font:700 13px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin:2px 2px 12px}
.search-wrap{position:relative;margin-bottom:12px}
.search-input{width:100%;height:50px;padding:0 18px 0 46px;background:var(--ink-2);border:0;box-shadow:inset 0 0 0 1px var(--line-2);border-radius:999px;color:var(--text);font:500 17px var(--sans);transition:box-shadow .2s}
.search-input::placeholder{color:var(--text-3)}
.search-input:focus{outline:none;box-shadow:inset 0 0 0 1px var(--brass)}
.search-icon{position:absolute;left:16px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--text-3);pointer-events:none}
#list-container{overflow-y:auto;overscroll-behavior:contain;margin:0 -6px;padding:2px 6px 6px;min-height:0}
.list-item{position:relative;cursor:pointer;min-height:56px;padding:12px 16px;border-radius:6px;margin-bottom:6px;background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);transition:background .15s,box-shadow .15s,transform .15s}
.list-item:hover{background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-2)}
.list-item.active{background:color-mix(in srgb,var(--brass) 10%,var(--ink-2));box-shadow:inset 0 0 0 1px var(--brass),inset 3px 0 0 var(--brass)}
.list-item-name{font:600 17px/1.3 var(--sans);color:var(--text)}
.list-item.active .list-item-name{color:var(--brass-2)}
.list-item-sub{font-size:14px;line-height:1.4;color:var(--text-2);margin-top:3px}
.cnt{color:var(--warn);font-weight:600}
.list-empty{color:var(--text-2);font-size:15px;padding:18px 12px;text-align:center}

.main{min-width:0}
.empty-state{position:relative;padding:72px 28px;border-radius:6px;text-align:center;background:linear-gradient(160deg,var(--ink-2),var(--ink-1));box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.empty-state::after{content:"";position:absolute;right:-80px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--brass),transparent 70%);opacity:.14;pointer-events:none}
.empty-title{font:700 clamp(30px,4vw,44px)/1.05 var(--display);color:var(--text);margin-bottom:10px;text-transform:capitalize}
.empty-sub{font-size:17px;color:var(--text-2)}
.empty-state .arrow{margin:0 auto 18px;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--brass-dim);color:var(--brass-2)}

.detail-header{padding:4px 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.detail-title{font:700 clamp(34px,4.6vw,54px)/1.04 var(--display);color:var(--text);letter-spacing:-.01em;overflow-wrap:anywhere}
.detail-sub{font-size:17px;color:var(--text-2);margin-top:10px}
.badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.issue-badge{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:999px;font:600 14px/1.2 var(--sans);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 38%,transparent)}
.issue-badge strong{font-weight:700;color:var(--text)}

.issue-card{padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.issue-card:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent)}
.issue-card.open{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent)}
.issue-card.open:hover{transform:none}
.issue-card-header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px}
.issue-card-header .lead{display:flex;align-items:center;gap:16px;min-width:0}
.issue-icon{flex:none;min-width:56px;height:56px;padding:0 8px;border-radius:10px;display:grid;place-items:center;font:700 26px/1 var(--display);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent)}
.issue-name{font:700 20px/1.25 var(--sans);color:var(--c);overflow-wrap:anywhere}
.issue-meta{font-size:15px;line-height:1.45;color:var(--text-2);margin-top:3px}
.issue-toggle{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--c);box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .25s,background .2s}
.issue-toggle svg{width:18px;height:18px}
.issue-card.open .issue-toggle{transform:rotate(180deg);background:color-mix(in srgb,var(--c) 14%,transparent)}
.issue-body{position:relative;z-index:1;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);cursor:default}
.issue-desc{margin-bottom:18px;padding:14px 16px;border-radius:4px;font-size:17px;line-height:1.6;color:var(--text);background:var(--ink-2);box-shadow:inset 3px 0 0 var(--c,var(--brass))}
.issue-desc .lbl{display:block;font:700 13px var(--sans);letter-spacing:.18em;text-transform:uppercase;margin-bottom:4px;color:var(--c,var(--brass))}
.desc-lead{position:relative;margin-bottom:24px;border-radius:6px}
.section-label{font:700 13px/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--brass));margin-bottom:8px}
.reps-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.reps-h h2{font:700 28px/1.1 var(--display)}
.reps-h span{color:var(--text-2);font-size:15px}
.rep-tag{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 12px;margin:0 6px 6px 0;border-radius:999px;font:500 15px/1.2 var(--sans);color:var(--text);background:color-mix(in srgb,var(--c) 8%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.rep-tag strong{color:var(--c);font-weight:700}
.sub-block{margin-top:18px}

/* ---------- tables (CSG .tbl) ---------- */
.tbl{margin-top:4px;border-radius:6px;overflow:auto;box-shadow:inset 0 0 0 1px var(--line);background:var(--ink-1)}
.tbl table{width:100%;border-collapse:collapse;font-size:16px;line-height:1.5}
.tbl th{position:sticky;top:0;z-index:1;text-align:left;font:700 13px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--brass));background:var(--ink-2);padding:12px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text)}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.tbl tbody tr:hover td{background:rgba(255,255,255,.035)}
.tbl .acct{color:var(--c);font-weight:700;white-space:nowrap;width:1%}
.tbl .dt{font:500 14px/1.5 var(--mono);color:var(--text-2);white-space:nowrap;width:1%}
.tbl .who{color:var(--text)}
.tbl .unk{color:var(--text-2);font-style:italic}
.lob-pill{display:inline-block;margin:2px 4px 2px 0;padding:4px 9px;border-radius:3px;font:700 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--lc,var(--text-2));background:color-mix(in srgb,var(--lc,#b9b4aa) 14%,transparent)}
.lob-hsi{--lc:var(--internet)}
.lob-video{--lc:var(--tv)}
.lob-xfm{--lc:var(--orders)}
.lob-xhs{--lc:var(--xh)}
.lob-cdv{--lc:var(--voice)}
.lob-other{--lc:var(--text-2)}

/* ---------- motion ---------- */
.enter .rise,.rise.go{animation:rise .6s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(min(var(--i,0),14) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}

/* ---------- responsive ---------- */
@media(max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .mini-chart{grid-column:1/-1}
}
@media(max-width:980px){
  .layout{grid-template-columns:300px minmax(0,1fr);gap:16px}
  .issue-card{padding:16px}
}
@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:relative;top:0;max-height:none}
  #list-container{max-height:min(52vh,460px)}
  .main{scroll-margin-top:76px}
}
@media(max-width:640px){
  .bar .region{display:none}
  .brand b{font-size:21px}
  .hero{padding:30px 0 18px}
  .hero p{font-size:17px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;width:100%;border-radius:12px;margin:20px 0 16px}
  .tab-btn{border-radius:9px;padding:0 10px;font-size:14px}
  .kpis{gap:10px}
  .stat-card{padding:16px;min-height:0}
  .stat-card .ico{width:38px;height:38px}
  .stat-num{font-size:48px}
  .stat-card .top{gap:10px;align-items:flex-start;flex-direction:column}
  .stat-label{font-size:12px}
  .mini-chart{padding:16px}
  .issue-card-header .lead{gap:12px}
  .issue-icon{min-width:48px;height:48px;font-size:22px}
  .issue-name{font-size:18px}
  .empty-state{padding:44px 20px}
  .tbl{box-shadow:none;overflow:visible;max-height:none;background:none}
  .tbl thead{display:none}
  .tbl table,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{margin-bottom:10px;border-radius:6px;background:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line);padding:6px 0}
  .tbl td{border:0;padding:6px 14px;width:auto!important}
  .tbl td::before{content:attr(data-h);display:block;font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--brass))}
  .tbl tbody tr:nth-child(even) td,.tbl tbody tr:hover td{background:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<!-- Perf (2026-09-02): exceptions-data.js is regenerated daily, but GitHub
     Pages serves it with max-age=600 and this tag had no cache-buster, so a
     rep could see 10-minute-old exceptions after an upload. The ?t= stamp is
     the same buster the other dashboards put on their data fetches. It has to
     be written by script because the URL is dynamic; document.write keeps the
     load synchronous, so window.RAW_DATA is set before the inline script
     below runs, exactly as before. (16.6 KB gzipped on the wire.) -->
<script>document.write('<script src="data/exceptions-data.js?t=' + Date.now() + '"><\/script>');</script>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <div class="brand"><b>Exceptions <em>Report</em></b><span>Blufox Mobile</span></div>
    <div class="region">Jeffrey Bilbrey Region</div>
  </div>
</header>

<div class="wrap">
  <section class="hero">
    <div class="eyebrow">BLUFOX MOBILE · EXCEPTION REPORT</div>
    <h1>Exceptions <em>Report</em></h1>
    <p>Commission Loss Analysis · Jeffrey Bilbrey Region</p>
  </section>
  <div class="hair"></div>

  <nav class="tabs" aria-label="Report view">
    <button class="tab-btn active" id="btn-rep" onclick="switchView('rep')">By Rep</button>
    <button class="tab-btn" id="btn-store" onclick="switchView('store')">By Store</button>
    <button class="tab-btn" id="btn-exception" onclick="switchView('exception')">By Exception</button>
    <button class="tab-btn" id="btn-cancel" onclick="switchView('cancel')">Cancellations</button>
  </nav>

  <section class="kpis">
    <div class="card stat-card rise go" style="--c:var(--warn);--i:0">
      <div class="top"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="stat-label" id="total-label">Total Exceptions</div></div>
      <div class="stat-num" id="total-count">0</div>
    </div>
    <div class="card stat-card rise go" style="--c:var(--internet);--i:1">
      <div class="top"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="stat-label" id="count-label">Reps Affected</div></div>
      <div class="stat-num" id="rep-count">0</div>
    </div>
    <div class="card mini-chart rise go" style="--i:2">
      <div class="mini-chart-title">Top Issues</div>
      <div id="top-issues-chart"></div>
    </div>
  </section>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="list-label" id="list-label">Reps</div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="search-input" id="search-input" type="text" placeholder="Search by name..." oninput="onSearch()" aria-label="Search by name"/>
      </div>
      <div id="list-container"></div>
    </aside>

    <main class="main" id="main-content">
      <div class="empty-state">
        <div class="empty-title" id="empty-title">SELECT A REP</div>
        <div class="empty-sub">Choose from the list to view detailed exceptions</div>
      </div>
    </main>
  </div>
</div>

<script>
const RAW_DATA = (window.RAW_DATA || []);

const CANCEL_DATA = (window.CANCEL_DATA || []);
const ISSUE_INFO = {
  "Cancel Rekey": { color:"#ff8a65", description:"The customer already had service at this address. The service was cancelled at the current address. The accounts below are from the new service accounts that were setup at the same address for the same customer. Cancelling a service then restarting a service at an address is not commissionable, and is considered a cancel/rekey. These can be a serious offense, and we need to refrain from practicing this at all costs." },
  "Fails 3-Day Rule": { color:"#ffb05c", description:"This address had active service within the last 3 days that matched with the new customer's data. To get paid on core services, new accounts must be completely new customers. Restarting services under a spouse or other family member's name are not commissionable." },

function acctTableHTML(acctMap, color, border) {
  const entries = Object.entries(acctMap);
  if (!entries.length) return '';
  // Sort by date ascending
  entries.sort((a, b) => {
    const parse = d => { const [m,day,y] = d.split(/[\/|]/)[0].split('/'); return new Date('20'+y, m-1, day); };
    return parse(a[0]) - parse(b[0]);
  });
  return `
    <div class="tbl" style="--c:${color}"><table>
      <thead><tr><th>#</th><th>Order Date</th><th>Lines of Business</th></tr></thead>
      <tbody>${entries.map(([key, lobs], i) => {
        const date = key.includes('|') ? key.split('|')[1] : key;
        const lobHTML = [...lobs].sort().map(l => {
          const cls = l==="HSI"?"lob-hsi":l==="Video"?"lob-video":l==="XFM"?"lob-xfm":l==="XHS"?"lob-xhs":l==="CDV"?"lob-cdv":"lob-other";
          return '<span class="lob-pill '+cls+'">'+l+'</span>';
        }).join("");
        return '<tr><td class="acct" data-h="#">Acct '+(i+1)+'</td><td class="dt" data-h="Order Date">'+date+'</td><td data-h="Lines of Business">'+lobHTML+'</td></tr>';
      }).join("")}</tbody>
    </table></div>`;
}

function acctDateRange(acctMap) {
  const dates = Object.keys(acctMap).map(k => k.includes('|') ? k.split('|')[1] : k);
  if (!dates.length) return '';
  const parsed = dates.map(d => { const [m,day,y] = d.split('/'); return {d, t: new Date('20'+y,m-1,day)}; });
  parsed.sort((a,b) => a.t - b.t);
  if (parsed.length === 1) return parsed[0].d;
  return parsed[0].d + ' – ' + parsed[parsed.length-1].d;
}
function getIssueKey(row) {
  return row.type === "Risk Assurance" ? "Risk Assurance" : (row.subType || row.type);
}
function issueColor(k) { return (ISSUE_INFO[k]||{color:"#b9b4aa"}).color; }

// ── State ────────────────────────────────────────────────────────────────────
let currentView = "rep";
let selectedKey  = null;
let expandedIssue = null;
let searchQuery  = "";

// ── Build stats ───────────────────────────────────────────────────────────────
function buildRepStats() {
  const map = {};
  RAW_DATA.filter(d => d.rep && d.rep.trim()).forEach(row => {
    const rep = row.rep;
    if (!map[rep]) map[rep] = { key: rep, label: rep, sub: row.store, issues: {}, allRows: [] };
    map[rep].allRows.push(row);
    const k = getIssueKey(row);
    if (!map[rep].issues[k]) map[rep].issues[k] = { count:0, acctMap: {} };
    // Group LOBs by order date — same date = same account (anonymised)
    if (row.lob) {
      if (!map[rep].issues[k].acctMap[row.date]) map[rep].issues[k].acctMap[row.date] = new Set();
      map[rep].issues[k].acctMap[row.date].add(row.lob);
    }
    map[rep].issues[k].count++;
  });
  return Object.values(map).sort((a,b) => b.allRows.length - a.allRows.length);
}

function buildStoreStats() {
  const map = {};
  RAW_DATA.forEach(row => {
    const s = row.store;
    if (!map[s]) map[s] = { key: s, label: s, reps: new Set(), issues: {}, allRows: [] };
    map[s].allRows.push(row);
    if (row.rep) map[s].reps.add(row.rep);
    const k = getIssueKey(row);
    if (!map[s].issues[k]) map[s].issues[k] = { count:0, acctMap: {} };
    if (row.lob) {
      const key2 = (row.rep||'') + '|' + row.date;
      if (!map[s].issues[k].acctMap[key2]) map[s].issues[k].acctMap[key2] = new Set();
      map[s].issues[k].acctMap[key2].add(row.lob);
    }
    map[s].issues[k].count++;
  });
  return Object.values(map).sort((a,b) => b.allRows.length - a.allRows.length);
}

const repStats   = buildRepStats();
const storeStats = buildStoreStats();

function buildExceptionStats() {
  const map = {};
  RAW_DATA.filter(d => d.rep && d.rep.trim()).forEach(row => {
    const k = getIssueKey(row);
    if (!map[k]) map[k] = { key: k, label: k, reps: new Set(), stores: new Set(), issues: {}, allRows: [] };
    map[k].allRows.push(row);
    if (row.rep) map[k].reps.add(row.rep);
    if (row.store) map[k].stores.add(row.store);
    // sub-breakdown by rep
    const rep = row.rep;
    if (!map[k].issues[rep]) map[k].issues[rep] = { count:0, acctMap: {}, store: row.store };
    map[k].issues[rep].count++;
    if (row.lob) {
      if (!map[k].issues[rep].acctMap[row.date]) map[k].issues[rep].acctMap[row.date] = new Set();
      map[k].issues[rep].acctMap[row.date].add(row.lob);
    }
  });
  return Object.values(map).sort((a,b) => b.allRows.length - a.allRows.length);
}

const exceptionStats = buildExceptionStats();

function cancelDesc(r)   { return (CANCEL_REASON_INFO[r]||{desc:"No description available."}).desc; }

// ── Build cancel stats (by store) ─────────────────────────────────────────────
function buildCancelStats() {
  const map = {};
  CANCEL_DATA.forEach(row => {
    const s = row.store;
    if (!map[s]) map[s] = { key: s, label: s, reasons: {}, allRows: [], reps: new Set() };
    map[s].allRows.push(row);
    if (row.rep) map[s].reps.add(row.rep);
    const r = row.reason;
    if (!map[s].reasons[r]) map[s].reasons[r] = { count: 0, rows: [] };
    map[s].reasons[r].count++;
    map[s].reasons[r].rows.push(row);
  });
  return Object.values(map).sort((a,b) => b.allRows.length - a.allRows.length);
}
const cancelStats = buildCancelStats();

function getStats() {
  if (currentView === "rep") return repStats;
  if (currentView === "store") return storeStats;
  if (currentView === "exception") return exceptionStats;
  return cancelStats;
}
function getSelected() { return getStats().find(s => s.key === selectedKey); }

// ── Top issues global ─────────────────────────────────────────────────────────
function getTopIssues() {
  const counts = {};
  RAW_DATA.filter(d => d.rep && d.rep.trim()).forEach(r => {
    const k = getIssueKey(r);
    counts[k] = (counts[k]||0) + 1;
  });
  return Object.entries(counts).sort((a,b) => b[1]-a[1]);
}
const topIssues = getTopIssues();
const filteredCount = RAW_DATA.filter(d => d.rep && d.rep.trim()).length;

// ── Render ────────────────────────────────────────────────────────────────────

      <div class="detail-sub">${subLine}</div>
    </div>
    <div class="badge-row rise" style="--i:1">${badgeHTML}</div>
    ${cardsHTML}`;
}

function render() {
  renderSidebar();
  renderMain();
}

// ── Event handlers ────────────────────────────────────────────────────────────
function onSearch() {
  searchQuery = document.getElementById("search-input").value;
  renderSidebar();
}

function switchView(v) {
  currentView  = v;
  selectedKey  = null;
  expandedIssue = null;
  searchQuery  = "";
  document.getElementById("btn-rep").classList.toggle("active",       v === "rep");
  document.getElementById("btn-store").classList.toggle("active",     v === "store");
  document.getElementById("btn-exception").classList.toggle("active", v === "exception");
  document.getElementById("btn-cancel").classList.toggle("active",    v === "cancel");
  document.getElementById("search-input").value = "";
  animateMain = true;
  render();
}

function selectItem(key) {
  selectedKey   = key;
  expandedIssue = null;
  animateMain = true;
  const lc = document.getElementById("list-container"), st = lc.scrollTop;
  render();
  lc.scrollTop = st;
  // Single-column layout (phones / iPad portrait): bring the detail into view.
  if (window.matchMedia("(max-width:860px)").matches) {
    document.getElementById("main-content").scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
  }
}

function toggleIssue(key) {
  expandedIssue = expandedIssue === key ? null : key;
  renderMain();
}

// ── Presentation: pointer-follow glow + keyboard activation ───────────────────
document.addEventListener("pointermove", e => {
  const c = e.target.closest && e.target.closest(".card");
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty("--mx", (e.clientX - r.left) + "px");
  c.style.setProperty("--my", (e.clientY - r.top) + "px");
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".list-item,.issue-card")) { e.preventDefault(); e.target.click(); }
});


// ── Init ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
